name: Research proposal checks
on: [pull_request]
permissions: {contents: read}
concurrency:
  group: research-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tally:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Check vote rules using local fixtures only
        run: python3 -m unittest discover -s scripts -p test_majority.py
