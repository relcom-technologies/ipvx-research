name: BCP REG-001 runner checks
on:
  pull_request:
    paths: ['contracts/bcp02/**', 'experiments/bcp02-reg-001/**', '.github/workflows/bcp-reg001.yml']
permissions: {contents: read}
jobs:
  reg001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: contracts/bcp02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Install only the locked compiler and local EVM dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: REG-001 step runner against the in-memory EVM, no network or transactions
        run: node --import ./test/offline.mjs --test reg001/runner.test.mjs
      - name: REG-001 results are recomputed from the committed run journals, offline
        run: node ../../experiments/bcp02-reg-001/summarize.mjs --check
