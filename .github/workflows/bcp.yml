name: BCP offline core
on:
  pull_request:
    paths: ['bcp/**', 'tests/bcp/**', 'docs/proposals/bcp-0.2/**', '.github/workflows/bcp.yml']
permissions: {contents: read}
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python3 -m pip install -r bcp/requirements.lock
      - name: Codec, authorization, persistence and compatibility (no sockets)
        run: python3 -B -m unittest discover -s tests/bcp -v
      - name: Reproduce the documented offline vector evidence
        run: |
          python3 -B tests/bcp/vector_report.py --output /tmp/bcp-offline-checks.json
          cmp bcp/evidence/offline-checks.json /tmp/bcp-offline-checks.json
