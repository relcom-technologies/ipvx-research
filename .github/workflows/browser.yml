name: Portal browser evidence
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: |
          python3 infra/export.py . /tmp/ipvx-public
          python3 infra/server.py --root /tmp/ipvx-public --bind 127.0.0.1 --port 8091 --revision "$GITHUB_SHA" >/tmp/ipvx-portal.log 2>&1 &
          for attempt in {1..20}; do curl -fsS http://127.0.0.1:8091/healthz && break || sleep 1; done
          curl -fsS http://127.0.0.1:8091/healthz || { cat /tmp/ipvx-portal.log; exit 1; }
          node scripts/browser_check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: portal-browser-evidence, path: browser-evidence/}
