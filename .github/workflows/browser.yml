name: Portal browser evidence
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-save --no-package-lock playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8091 --bind 127.0.0.1 >/tmp/ipvx-portal.log 2>&1 &
          node scripts/browser_check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: portal-browser-evidence, path: browser-evidence/}
