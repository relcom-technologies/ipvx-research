name: BCP light client checks
on:
  pull_request:
    paths: ['lightclient/**', 'adapters/**', 'bcp/**', 'experiments/bcp02-reg-001-lc/**', 'experiments/bcp02-reg-001/runs/**', '.github/workflows/bcp-light.yml']
permissions: {contents: read}
jobs:
  light:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - run: python3 -m pip install -r adapters/bcp02/requirements.lock
      - name: Offline light-client reads; the accepted adapter stays unchanged
        run: |
          python3 -B -m unittest discover -s lightclient/bcp02/tests -v
          python3 -B -m unittest discover -s experiments/bcp02-reg-001-lc/tests -v
          python3 -B adapters/bcp02/preserve.py
          python3 -B adapters/bcp02/checks.py --output /tmp/bcp-adapter-checks.json
          cmp adapters/bcp02/evidence/checks.json /tmp/bcp-adapter-checks.json
